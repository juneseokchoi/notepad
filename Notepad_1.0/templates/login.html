<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    /* 모달 배경 */
    .modal {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
    }

    /* 모달 내용 */
    .modal-content {
      background-color: white;
      margin: 15% auto;
      padding: 20px;
      border: 1px solid #EAEAEA;
      width: 300px;
      border-radius: 10px;
      text-align: center;
    }

    input {
      padding: 8px;
      margin-top: 10px;
      width: 80%;
    }

    button {
      margin-top: 15px;
      padding: 8px 16px;
    }
  </style>
</head>

<body>
  <div id="loginModal" class="modal">
    <div class="modal-content">
      <h3>비밀번호 입력</h3>
      <form action="/login" method="POST" id="loginForm">
        <input type="password" name="password" id="password">
        <br>
        <button type="submit">로그인</button>
      </form>
    </div>
  </div>

</body>
<script>
  window.onload = function () {
    // 페이지가 로드되면 비밀번호 입력란에 자동으로 포커스를 준다.
    document.getElementById("password").focus();
  }
</script>
